version: "3.9"

services:
  # ── Frontend (React + Nginx) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - healthcare-network
    restart: unless-stopped

  # ── Backend (FastAPI) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:password@postgres:5432/healthcare
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma:2b}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthcare-network
    restart: unless-stopped

  # ── Database (PostgreSQL) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── LLM Server (Ollama) ────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: healthcare-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - healthcare-network
    deploy:
      resources:
        reservations:
          memory: 4G
    restart: unless-stopped

  # ── Monitoring: Prometheus ──────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: healthcare-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - healthcare-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ── Monitoring: Grafana ─────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: healthcare-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - healthcare-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres-data:
  ollama-data:
  prometheus-data:
  grafana-data:

networks:
  healthcare-network:
    driver: bridge
